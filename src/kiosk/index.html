<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argent Lite Kiosk</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0b0d10;
        color: #e7ecf1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Ubuntu, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #kiosk {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
      }
      #gear {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #1a1f25;
        color: #8a96a4;
        font-size: 22px;
        cursor: pointer;
      }
      #gear:hover {
        background: #232a32;
        color: #e7ecf1;
      }
      #disc {
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 45%,
          #6ab7ff 0%,
          #3a78c7 28%,
          #1c3a66 60%,
          #0b0d10 85%
        );
        box-shadow:
          0 0 80px rgba(106, 183, 255, 0.25),
          inset 0 0 60px rgba(11, 13, 16, 0.6);
        transform-origin: center;
        animation: breath 2.4s ease-in-out infinite;
      }
      #disc.state-idle {
        animation: breath 2.4s ease-in-out infinite;
      }
      #disc.state-listening {
        animation: spin 6s linear infinite;
      }
      #disc.state-thinking {
        animation: spin 1.4s linear infinite;
      }
      #disc.state-speaking {
        animation: pulse 0.6s ease-in-out infinite;
      }
      @keyframes breath {
        0%, 100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      #status {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 0.02em;
        min-height: 36px;
        text-align: center;
      }
      #talk {
        width: 280px;
        height: 100px;
        border-radius: 20px;
        border: none;
        background: #6ab7ff;
        color: #0b0d10;
        font-size: 24px;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      #talk:active,
      #talk.pressed {
        background: #3a78c7;
        color: #e7ecf1;
      }
    </style>
  </head>
  <body>
    <main id="kiosk">
      <button id="gear" type="button" aria-label="settings">⚙</button>
      <div id="disc" class="state-idle" role="img" aria-label="assistant"></div>
      <div id="status">Tap to talk</div>
      <button id="talk" type="button">Tap to Talk</button>
    </main>
    <script>
      (function () {
        var disc = document.getElementById("disc");
        var statusEl = document.getElementById("status");
        var talk = document.getElementById("talk");
        var gear = document.getElementById("gear");

        function applyStatus(s) {
          if (!s || !s.state) return;
          disc.className = "state-" + s.state;
          statusEl.textContent = s.statusText || "";
        }

        function post(path) {
          return fetch(path, { method: "POST" }).then(function (r) {
            return r.json();
          });
        }

        talk.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          talk.classList.add("pressed");
          post("/api/talk/start").catch(function () {});
        });
        function release() {
          if (!talk.classList.contains("pressed")) return;
          talk.classList.remove("pressed");
          post("/api/talk/end").catch(function () {});
        }
        talk.addEventListener("pointerup", release);
        talk.addEventListener("pointercancel", release);
        talk.addEventListener("pointerleave", release);

        gear.addEventListener("click", function () {
          alert("settings panel ships cycle-22");
        });

        fetch("/api/status")
          .then(function (r) {
            return r.json();
          })
          .then(applyStatus)
          .catch(function () {});

        try {
          var es = new EventSource("/events");
          es.addEventListener("status", function (ev) {
            try {
              applyStatus(JSON.parse(ev.data));
            } catch (_) {}
          });
        } catch (_) {}
      })();
    </script>
  </body>
</html>
