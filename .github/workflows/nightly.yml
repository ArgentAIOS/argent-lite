name: Nightly Pi Smoke

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi-smoke:
    runs-on: [self-hosted, argent-lite, pi5]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke
        run: bash scripts/ci-smoke.sh
